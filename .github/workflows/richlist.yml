name: Update richlist

on:
  schedule:
    # Every 30 minutes, but NOT at :00/:30 - GitHub delays or drops scheduled runs at the top of the hour when it is busy
    - cron: '7,37 * * * *'
  workflow_dispatch:           # "Run workflow" button in the Actions tab

permissions:
  contents: write              # needed to push the richlist-data branch

# Never run two crawls at once (the first full crawl can take hours)
concurrency:
  group: richlist
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore saved state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/restore-richlist.sh

      - name: Build snapshot
        # --max-minutes keeps a long first crawl inside the job limit; the next run simply continues
        run: node tools/build-richlist.js --concurrency 6 --max-minutes 330

      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/publish-richlist.sh

      - name: Summary
        if: always()
        run: node tools/ci-summary.js >> "$GITHUB_STEP_SUMMARY"
